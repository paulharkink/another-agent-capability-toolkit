name: Request release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Calculate and write the selected version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(go run github.com/caarlos0/svu/v3@v3.4.1 "$BUMP")
          version=${version#v}
          expected="curl -fsSL https://raw.githubusercontent.com/paulharkink/another-agent-capability-toolkit/main/install.sh | sh -s -- -v $version"
          sed -E -i "s#(install\\.sh \\| sh -s -- -v )[0-9]+\\.[0-9]+\\.[0-9]+#\\1$version#" README.md
          if ! grep -Fqx "$expected" README.md; then
            echo "README install command was not updated to $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: release/v${{ steps.version.outputs.version }}
          delete-branch: true
          title: Release v${{ steps.version.outputs.version }}
          commit-message: "docs: prepare release v${{ steps.version.outputs.version }}"
          body: |
            Updates the single README install command to v${{ steps.version.outputs.version }}.

            Merging this PR creates the version tag and starts the GoReleaser release build.
