name: Native and container checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...
      - name: Race checks
        if: runner.os != 'Windows'
        run: go test -race ./... -count=1
  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Limit Docker downloads for the ECR Public quota
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/docker
          if ! sudo test -f /etc/docker/daemon.json; then echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null; fi
          sudo jq '. + {"max-concurrent-downloads": 1}' /etc/docker/daemon.json | sudo tee /tmp/docker-daemon.json >/dev/null
          sudo install -m 0644 /tmp/docker-daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Prefetch digest-pinned Python bases from ECR Public
        run: |
          sh tools/prefetch-python-bases.sh linux/amd64 \
            public.ecr.aws/docker/library/python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72 \
            public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f \
            public.ecr.aws/docker/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - run: go test -tags integration ./tests/integration -run TestDockerMCP -count=1
      - run: go test -tags docker_integration ./internal/mcp ./internal/packagehelpers ./internal/sessionsearch ./tests/packages -count=1
      - run: sh tools/test-containers.sh
