name: Tag merged release request
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
  contents: write
jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag README version and start release build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          tag="${RELEASE_BRANCH#release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release branch: $RELEASE_BRANCH" >&2
            exit 1
          fi
          version="${tag#v}"
          expected="curl -fsSL https://raw.githubusercontent.com/paulharkink/another-agent-capability-toolkit/main/install.sh | sh -s -- -v $version"
          if ! grep -Fqx "$expected" README.md; then
            echo "README.md must contain '$expected' before creating $tag." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --repo paulharkink/another-agent-capability-toolkit --ref "$tag"
