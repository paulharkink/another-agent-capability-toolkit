name: Build and publish release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (dispatch from main only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare-release:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && inputs.release_tag == '') ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == 'main' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-release.outputs.tag }}
      version: ${{ steps.resolve-release.outputs.version }}
      source_commit: ${{ steps.resolve-release.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release source
        id: resolve-release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$EVENT_REF_TYPE" == tag && -z "$RELEASE_TAG_INPUT" ]]; then
              # tag-release.yml dispatches this workflow on the freshly created tag.
              tag="$EVENT_REF_NAME"
            elif [[ "$EVENT_REF_TYPE" == branch && "$EVENT_REF_NAME" == main && -n "$RELEASE_TAG_INPUT" ]]; then
              # Recovery dispatches run the current workflow from main against an existing tag.
              tag="$RELEASE_TAG_INPUT"
            else
              echo 'Manual release dispatch must run on a version tag without release_tag, or from main with release_tag.' >&2
              exit 1
            fi
          else
            tag="$EVENT_REF_NAME"
            if [[ "$EVENT_REF_TYPE" != tag || -n "$RELEASE_TAG_INPUT" ]]; then
              echo 'Automatic release workflow must run on a version tag without a release_tag input.' >&2
              exit 1
            fi
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          source_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$source_commit" != "$checked_out_commit" ]]; then
            echo "Checked out ${checked_out_commit}, but ${tag} resolves to ${source_commit}." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${source_commit}" >> "$GITHUB_OUTPUT"

      - name: Require README to name this release
        shell: bash
        run: |
          expected="curl -fsSL https://raw.githubusercontent.com/paulharkink/another-agent-capability-toolkit/main/install.sh | sh -s -- -v ${{ steps.resolve-release.outputs.version }}"
          if ! grep -Fqx "$expected" README.md; then
            echo "README.md must contain '$expected' before publishing this release." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./... -count=1

      # Build and validate release binaries before any MCP image is published.
      - uses: goreleaser/goreleaser-action@v6.2.1
        with:
          version: v2.18.2
          args: release --skip=publish --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-mcp-amd64:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Enable the Docker containerd image store
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/docker
          if ! sudo test -f /etc/docker/daemon.json; then echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null; fi
          sudo jq '.features = ((.features // {}) + {"containerd-snapshotter": true}) | . + {"max-concurrent-downloads": 1}' /etc/docker/daemon.json | sudo tee /tmp/docker-daemon.json >/dev/null
          sudo install -m 0644 /tmp/docker-daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -Fq 'io.containerd.snapshotter.v1'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify the host Buildx builder
        run: |
          docker buildx version
          docker buildx inspect default --bootstrap | tee /tmp/buildx-inspect.txt
          grep -Fq 'Driver: docker' /tmp/buildx-inspect.txt

      - name: Prefetch digest-pinned Python base
        run: sh tools/prefetch-python-bases.sh linux/amd64 public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f

      - name: Build and stage package-only MCP contexts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          mkdir -p image-digests/amd64
          found=0
          for dockerfile in packages/*/mcp/Dockerfile; do
            [[ -f "$dockerfile" ]] || continue
            found=1
            package="$(basename "$(dirname "$(dirname "$dockerfile")")")"
            context="$(dirname "$dockerfile")"
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${package}-mcp"
            staging="${image}:build-${{ needs.prepare-release.outputs.source_commit }}-amd64"
            metadata="$(mktemp)"
            docker buildx build \
              --file "$dockerfile" \
              --platform linux/amd64 \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=v${version}" \
              --label "org.opencontainers.image.revision=${{ needs.prepare-release.outputs.source_commit }}" \
              --provenance=true \
              --sbom=true \
              --metadata-file "$metadata" \
              --output "type=image,name=${staging},push=true" \
              "$context"
            digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
            test -n "$digest" && test "$digest" != null
            printf '%s %s %s\n' "$image" "$staging" "$digest" > "image-digests/amd64/${package}.txt"
            rm -f "$metadata"
          done
          if [[ "$found" == 0 ]]; then echo 'No packages/*/mcp/Dockerfile build contexts found.' >&2; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-image-digests-amd64-${{ needs.prepare-release.outputs.tag }}
          path: image-digests/amd64/*.txt
          if-no-files-found: error
          retention-days: 7

  build-mcp-arm64:
    needs: build-mcp-amd64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Enable the Docker containerd image store
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/docker
          if ! sudo test -f /etc/docker/daemon.json; then echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null; fi
          sudo jq '.features = ((.features // {}) + {"containerd-snapshotter": true}) | . + {"max-concurrent-downloads": 1}' /etc/docker/daemon.json | sudo tee /tmp/docker-daemon.json >/dev/null
          sudo install -m 0644 /tmp/docker-daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -Fq 'io.containerd.snapshotter.v1'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify the host Buildx builder
        run: |
          docker buildx version
          docker buildx inspect default --bootstrap | tee /tmp/buildx-inspect.txt
          grep -Fq 'Driver: docker' /tmp/buildx-inspect.txt

      - name: Prefetch digest-pinned Python base
        run: sh tools/prefetch-python-bases.sh linux/arm64 public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f

      - name: Build and stage package-only MCP contexts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          mkdir -p image-digests/arm64
          found=0
          for dockerfile in packages/*/mcp/Dockerfile; do
            [[ -f "$dockerfile" ]] || continue
            found=1
            package="$(basename "$(dirname "$(dirname "$dockerfile")")")"
            context="$(dirname "$dockerfile")"
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${package}-mcp"
            staging="${image}:build-${{ needs.prepare-release.outputs.source_commit }}-arm64"
            metadata="$(mktemp)"
            docker buildx build \
              --file "$dockerfile" \
              --platform linux/arm64 \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=v${version}" \
              --label "org.opencontainers.image.revision=${{ needs.prepare-release.outputs.source_commit }}" \
              --provenance=true \
              --sbom=true \
              --metadata-file "$metadata" \
              --output "type=image,name=${staging},push=true" \
              "$context"
            digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
            test -n "$digest" && test "$digest" != null
            printf '%s %s %s\n' "$image" "$staging" "$digest" > "image-digests/arm64/${package}.txt"
            rm -f "$metadata"
          done
          if [[ "$found" == 0 ]]; then echo 'No packages/*/mcp/Dockerfile build contexts found.' >&2; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-image-digests-arm64-${{ needs.prepare-release.outputs.tag }}
          path: image-digests/arm64/*.txt
          if-no-files-found: error
          retention-days: 7

  publish-mcp-manifests:
    needs: [prepare-release, build-mcp-amd64, build-mcp-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: mcp-image-digests-amd64-${{ needs.prepare-release.outputs.tag }}
          path: image-digests/amd64
      - uses: actions/download-artifact@v4
        with:
          name: mcp-image-digests-arm64-${{ needs.prepare-release.outputs.tag }}
          path: image-digests/arm64

      - name: Require every GHCR package to be public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for digest_file in image-digests/amd64/*.txt; do
            image="$(awk '{print $1}' "$digest_file")"
            package="${image#ghcr.io/${GITHUB_REPOSITORY,,}/}"
            package="${package%:v*}"
            encoded_package="${GITHUB_REPOSITORY#*/}%2F${package}"
            if ! package_metadata="$(gh api "/user/packages/container/${encoded_package}" 2>&1)"; then
              echo "Could not inspect GHCR visibility for ${image%:*}." >&2
              echo 'Set the package visibility to Public in GitHub Packages settings, then rerun this release workflow.' >&2
              echo "$package_metadata" >&2
              exit 1
            fi
            visibility="$(jq -r '.visibility // empty' <<<"$package_metadata")"
            if [[ "$visibility" != public ]]; then
              echo "GHCR package ${image%:*} has visibility '${visibility:-unknown}', not public." >&2
              echo 'Set the package visibility to Public in the GitHub Packages settings, then rerun this release workflow.' >&2
              exit 1
            fi
          done

      - name: Assemble version-pinned multi-platform images
        env:
          GH_TOKEN: ${{ github.token }}
          AACT_RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: bash tools/publish-mcp-manifests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-image-digests-${{ needs.prepare-release.outputs.tag }}
          path: image-digests/final/*.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs: [prepare-release, publish-mcp-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v6.2.1
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
