name: Publish versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require README to name this release
        shell: bash
        run: |
          expected="curl -fsSL https://raw.githubusercontent.com/paulharkink/another-agent-capability-toolkit/main/install.sh | sh -s -- -v ${GITHUB_REF_NAME#v}"
          if ! grep -Fqx "$expected" README.md; then
            echo "README.md must contain '$expected' before publishing this release." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - name: Build matching archives
        shell: bash
        run: go run ./tools/release --version "${GITHUB_REF_NAME#v}" --out dist
      - name: Publish archives and bootstrap installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 --verify-tag --generate-notes
