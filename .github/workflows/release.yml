name: Build and publish release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require README to name this release
        shell: bash
        run: |
          expected="curl -fsSL https://raw.githubusercontent.com/paulharkink/another-agent-capability-toolkit/main/install.sh | sh -s -- -v ${GITHUB_REF_NAME#v}"
          if ! grep -Fqx "$expected" README.md; then
            echo "README.md must contain '$expected' before publishing this release." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./... -count=1

      - uses: goreleaser/goreleaser-action@v6.2.1
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
