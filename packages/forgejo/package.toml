schema_version = 1
id = "forgejo"
name = "Forgejo"

[skill]
name = "forgejo"

[[inputs]]
name = "local_port"
type = "integer"
label = "Local port"
config_key = "mcp.local_port"
default = 8080
min = 1024
max = 65535

[[inputs]]
name = "host"
type = "string"
label = "Host"
default = "127.0.0.1"

[[inputs]]
name = "base_url"
type = "string"
label = "Base URL"
config_key = "forgejo.base_url"
required = true

[[inputs]]
name = "token"
type = "secret"
label = "Token"

[mcp]
name = "forgejo"
runtime = "docker"
transport = "streamable-http"
container_port = 8080
endpoint_path = "/mcp"
host_port_input = "local_port"
image = "git.b4mad.industries/agentic-forges/forgejo-mcp:v2.33.0@sha256:90256ca6219677cac950df0a5e9181638cb1899e0f845697543ed14d69598fcf"

[mcp.actions.prepare]
command = ["bin/inspector-helper", "forgejo", "prepare"]
timeout_seconds = 300

[mcp.actions.prepare.windows]
command = ["bin/inspector-helper.exe", "forgejo", "prepare"]

[mcp.actions.authenticate]
command = ["bin/inspector-helper", "forgejo", "authenticate"]
timeout_seconds = 300

[mcp.actions.authenticate.windows]
command = ["bin/inspector-helper.exe", "forgejo", "authenticate"]

[ui]
[[ui.sections]]
id = "connection"
title = "Connection"
fields = ["host", "local_port", "base_url"]
[[ui.sections]]
id = "authentication"
title = "Authentication"
fields = ["token"]
