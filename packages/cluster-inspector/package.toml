schema_version = 1
id = "cluster-inspector"
name = "Cluster Inspector"

[skill]
name = "cluster-inspector"
files = ["scripts"]

[[templates]]
source = "SKILL.md.mustache"
destination = "SKILL.md"

[[inputs]]
name = "local_port"
type = "integer"
label = "Listen port"
config_key = "mcp.local_port"
default = 8765
min = 1024
max = 65535

[[inputs]]
name = "host"
type = "string"
label = "Listen address"
default = "127.0.0.1"

[[inputs]]
name = "advertised_host"
type = "string"
label = "Client address host"
default = "localhost"

[[inputs]]
name = "registration_name"
type = "string"
label = "MCP registration name"
hint = "User-editable name shown by MCP clients for this server."
config_key = "mcp.registration_name"
required = true

[[inputs]]
name = "api_server"
type = "string"
label = "API server"
config_key = "cluster.api_server"
required = true

[[inputs]]
name = "token"
type = "secret"
label = "Token"
exclusive_group = "cluster_credentials"

[[inputs]]
name = "kubeconfig"
type = "file"
label = "Source kubeconfig"
hint = "Import source; not a live path · AACT uses managed credential material at runtime"
exclusive_group = "cluster_credentials"

[[inputs]]
name = "connections"
type = "multichoice"
label = "Read-only database queries (optional)"
options_from = "dbms.*.tenants.*"

[[inputs]]
name = "ca_file"
type = "file"
label = "CA file"
config_key = "cluster.ca_file"

[[inputs]]
name = "ca_data"
type = "string"
label = "CA data"
config_key = "cluster.ca_data"

[[inputs]]
name = "insecure_skip_tls_verify"
type = "boolean"
label = "Insecure skip tls verify"
config_key = "cluster.insecure_skip_tls_verify"

[[inputs]]
name = "verify_x509_strict"
type = "boolean"
label = "Verify X.509 strict"
config_key = "cluster.verify_x509_strict"
default = true

[[inputs]]
name = "tekton_default_namespace"
type = "string"
label = "Tekton default namespace"
config_key = "tekton.default_namespace"

[[inputs]]
name = "tekton_branch_selector_key"
type = "string"
label = "Tekton branch selector key"
config_key = "tekton.branch_selector_key"

[[inputs]]
name = "tekton_repository_selector_key"
type = "string"
label = "Tekton repository selector key"
config_key = "tekton.repository_selector_key"

[[inputs]]
name = "tekton_repository_context_hook"
type = "file"
label = "Tekton repository context hook"
config_key = "tekton.repository_context_hook"

[mcp]
credential_files = ["kubeconfig"]
name = "cluster-inspector"
runtime = "docker"
transport = "streamable-http"
container_port = 8765
endpoint_path = "/mcp"
host_port_input = "local_port"
bind_ip_input = "host"
advertised_host_input = "advertised_host"
registration_name_input = "registration_name"
registration_timeout_ms = 60000
build_context = "./mcp"

[mcp.actions.prepare]
command = ["bin/inspector-helper", "cluster-inspector", "prepare"]
timeout_seconds = 300

[mcp.actions.prepare.windows]
command = ["bin/inspector-helper.exe", "cluster-inspector", "prepare"]

[mcp.actions.authenticate]
command = ["bin/inspector-helper", "cluster-inspector", "authenticate"]
timeout_seconds = 300

[mcp.actions.authenticate.windows]
command = ["bin/inspector-helper.exe", "cluster-inspector", "authenticate"]

[ui]
[[ui.sections]]
id = "connection"
title = "Connection"
fields = ["host", "advertised_host", "local_port", "registration_name", "api_server"]
[[ui.sections]]
id = "authentication"
title = "Authentication"
fields = ["token", "kubeconfig"]
[[ui.sections]]
id = "databases"
title = "Databases"
fields = ["connections"]
[[ui.sections]]
id = "tls"
title = "TLS"
fields = ["ca_file", "ca_data", "insecure_skip_tls_verify", "verify_x509_strict"]
[[ui.sections]]
id = "tekton"
title = "Tekton"
fields = ["tekton_default_namespace", "tekton_branch_selector_key", "tekton_repository_selector_key", "tekton_repository_context_hook"]
