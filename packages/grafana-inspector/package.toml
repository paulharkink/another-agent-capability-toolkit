schema_version = 1
id = "grafana-inspector"
name = "Grafana Inspector"

[skill]
name = "grafana-inspector"

[[templates]]
source = "SKILL.md.mustache"
destination = "SKILL.md"

[[inputs]]
name = "local_port"
type = "integer"
label = "Listen port"
config_key = "mcp.local_port"
default = 8765
min = 1024
max = 65535

[[inputs]]
name = "host"
type = "string"
label = "Listen address"
default = "127.0.0.1"

[[inputs]]
name = "advertised_host"
type = "string"
label = "Client address host"
default = "localhost"

[[inputs]]
name = "registration_name"
type = "string"
label = "MCP registration name"
hint = "User-editable name shown by MCP clients for this server."
config_key = "mcp.registration_name"
required = true

[[inputs]]
name = "url"
type = "string"
label = "Url"
config_key = "grafana.url"
required = true

[[inputs]]
name = "auth_mode"
type = "choice"
label = "Authentication mode"
config_key = "grafana.auth_mode"
required = true
[[inputs.options]]
value = "api_token"
label = "api_token"
[[inputs.options]]
value = "session_cookie"
label = "session_cookie"

[[inputs]]
name = "datasource_uid"
type = "string"
label = "Datasource UID"
config_key = "grafana.datasource_uid"

[[inputs]]
name = "token"
type = "secret"
label = "Token"
visible_when = { auth_mode = "api_token" }

[[inputs]]
name = "grafana_session"
type = "secret"
label = "Grafana session"
visible_when = { auth_mode = "session_cookie" }

[[inputs]]
name = "oauth_refresh"
type = "secret"
label = "OAuth refresh"
visible_when = { auth_mode = "session_cookie" }

[[inputs]]
name = "session_expiry"
type = "secret"
label = "Session expiry"
visible_when = { auth_mode = "session_cookie" }

[[inputs]]
name = "refresh_cookie_name"
type = "string"
label = "Refresh cookie name"
config_key = "grafana.refresh_cookie_name"
visible_when = { auth_mode = "session_cookie" }

[[inputs]]
name = "ca_file"
type = "file"
label = "CA file"
config_key = "grafana.ca_file"

[[inputs]]
name = "verify_x509_strict"
type = "boolean"
label = "Verify X.509 strict"
config_key = "grafana.verify_x509_strict"

[[inputs]]
name = "vault_addr"
type = "string"
label = "Vault addr"
config_key = "grafana.vault_addr"
visible_when = { auth_mode = "api_token" }

[[inputs]]
name = "vault_path"
type = "string"
label = "Vault path"
config_key = "grafana.vault_path"
visible_when = { auth_mode = "api_token" }

[[inputs]]
name = "vault_key"
type = "string"
label = "Vault key"
config_key = "grafana.vault_key"
visible_when = { auth_mode = "api_token" }

[mcp]
credential_files = ["auth.json"]
name = "grafana-inspector"
runtime = "docker"
transport = "streamable-http"
container_port = 8765
endpoint_path = "/mcp"
host_port_input = "local_port"
bind_ip_input = "host"
advertised_host_input = "advertised_host"
registration_name_input = "registration_name"
registration_timeout_ms = 60000
build_context = "./mcp"
release_image = "ghcr.io/paulharkink/another-agent-capability-toolkit/grafana-inspector-mcp:v{aact_version}"

[mcp.actions.prepare]
command = ["bin/inspector-helper", "grafana-inspector", "prepare"]
timeout_seconds = 300

[mcp.actions.prepare.windows]
command = ["bin/inspector-helper.exe", "grafana-inspector", "prepare"]

[mcp.actions.authenticate]
command = ["bin/inspector-helper", "grafana-inspector", "authenticate"]
timeout_seconds = 300

[mcp.actions.authenticate.windows]
command = ["bin/inspector-helper.exe", "grafana-inspector", "authenticate"]

[ui]
[[ui.sections]]
id = "connection"
title = "Connection"
fields = ["host", "advertised_host", "local_port", "registration_name", "url"]
[[ui.sections]]
id = "authentication"
title = "Authentication"
fields = ["auth_mode", "token", "grafana_session", "oauth_refresh", "session_expiry", "refresh_cookie_name"]
[[ui.sections]]
id = "datasource"
title = "Datasource"
fields = ["datasource_uid"]
[[ui.sections]]
id = "tls"
title = "TLS"
fields = ["ca_file", "verify_x509_strict"]
[[ui.sections]]
id = "vault"
title = "Vault"
fields = ["vault_addr", "vault_path", "vault_key"]
